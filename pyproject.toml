[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twelf-proof-slicer"
version = "0.1.0"
description = "Dependency-directed slicing for Twelf/LF signatures"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "skylee03" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Compilers",
]

[project.scripts]
twelf-slice = "twelf_slicer.cli:main"

[tool.setuptools.packages.find]
include = ["twelf_slicer*"]
